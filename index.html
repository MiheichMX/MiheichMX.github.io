<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIHEICH MX // SYSTEM LOADING</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #0A0E32;
            color: #E2E8F0;
            font-family: 'JetBrains Mono', monospace;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }
        /* Кибер-сетка на фоне */
        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: 
                linear-gradient(to right, rgba(0, 240, 255, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0, 240, 255, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
        }
        .container {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 2.5rem;
            background: rgba(10, 14, 50, 0.85);
            border: 1px solid rgba(0, 240, 255, 0.3);
            border-radius: 16px;
            box-shadow: 0 0 40px rgba(0, 240, 255, 0.15), inset 0 0 20px rgba(247, 22, 181, 0.1);
            max-width: 520px;
            width: 90%;
        }
        .tag {
            display: inline-block;
            color: #00F0FF;
            font-size: 0.8rem;
            letter-spacing: 3px;
            margin-bottom: 1.2rem;
            text-transform: uppercase;
            border: 1px solid rgba(0, 240, 255, 0.4);
            padding: 4px 12px;
            border-radius: 4px;
        }
        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 0.8rem;
            color: #FFFFFF;
            text-shadow: 0 0 15px rgba(0, 240, 255, 0.6);
        }
        h1 span {
            color: #F716B5;
            text-shadow: 0 0 15px rgba(247, 22, 181, 0.8);
        }
        p {
            color: #94A3B8;
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 2rem;
        }
        .status-box {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 0.85rem;
            color: #00F0FF;
            background: rgba(0, 240, 255, 0.08);
            padding: 10px 16px;
            border-radius: 8px;
            border: 1px dashed rgba(0, 240, 255, 0.3);
        }
        .dot {
            width: 8px;
            height: 8px;
            background: #00F0FF;
            border-radius: 50%;
            box-shadow: 0 0 8px #00F0FF;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.7); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="tag">System Status</div>
        <h1>MIHEICH<span>.MX</span></h1>
        <p>Инженерный B2B Digital: Веб-разработка, Яндекс.Директ, Геомаркетинг и Презентации.</p>
        <div class="status-box">
            <div class="dot"></div>
            <span>Развертывание основного интерфейса...</span>
        </div>
    </div>
</body>
</html>
